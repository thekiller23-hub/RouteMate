services:
  db:
    image: postgres:16-alpine
    container_name: routemate_postgres
    restart: always
    environment:
      POSTGRES_DB: routemate_db
      POSTGRES_USER: routemate_user
      POSTGRES_PASSWORD: routemate_secure_password_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routemate_user -d routemate_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: routemate_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "production-routemate-secret-key-change-in-prod"
      DATABASE_URL: "postgresql://routemate_user:routemate_secure_password_2026@db:5432/routemate_db"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      RAZORPAY_KEY_ID: "${RAZORPAY_KEY_ID:-rzp_test_mock_key}"
      RAZORPAY_KEY_SECRET: "${RAZORPAY_KEY_SECRET:-rzp_test_mock_secret}"
    ports:
      - "8000:8000"
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: routemate_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  backend_media:
  backend_static:

